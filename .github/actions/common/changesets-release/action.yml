    #         echo "Could not find directory for package $package_name"
    #         exit 1
    #       fi
    #     done
    #   env:
    #     GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
    #     NODE_AUTH_TOKEN: ${{ inputs.NPM_TOKEN }}

    - name: Create Git Tags for Published Packages
      if: steps.changesets.outputs.published == 'true'
      shell: bash
      run: |
        # Get list of published packages and their versions
        published_packages=$(npm list --json | jq -r '.dependencies | to_entries[] | "\(.key)@\(.value.version)"')
        
        # Create and push tags for each package
        echo "$published_packages" | while read -r pkg_ver; do
          pkg_name=$(echo "$pkg_ver" | cut -d@ -f1)
          version=$(echo "$pkg_ver" | cut -d@ -f2)
          
          # Create annotated tag
          git tag -a "${pkg_name}@${version}" -m "Release ${pkg_name} version ${version}"
          git push origin "${pkg_name}@${version}"
          
          echo "Created and pushed tag: ${pkg_name}@${version}"
        done
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}

