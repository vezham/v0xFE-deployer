name: changesets for release 
description: Sets up Changesets for NPM release

inputs:
  GITHUB_TOKEN:
    required: true
    type: string
  NPM_TOKEN:
    required: true
    type: string

runs:
  using: composite
  steps:
    - name: ci-setup | SHA
      uses: vezham/v0xFE-deployer/.github/actions/common/log-setup@timeline
    
    - name: npm | whoami
      shell: bash
      run: |
        npm whoami
      env:
        NODE_AUTH_TOKEN: ${{ inputs.NPM_TOKEN }}

    - name: npm | whoami
      shell: bash
      run: |
        pnpm changeset status
      env:
        NODE_AUTH_TOKEN: ${{ inputs.NPM_TOKEN }}
        
    - name: changesets/NPM | release - create release PR & Publish
      id: changesets
      uses: changesets/action@v1
      with:
        # publish: pnpm changeset publish | pnpm v:changeset:release | ${{ steps.release-check.outputs.publish }}
        version: pnpm changeset version # version: pnpm version
        commit: "ci(changesets): version packages"
        title: "ci(changesets): :package: release packages"
        # setupGitUser: false
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        NPM_TOKEN: ${{ inputs.NPM_TOKEN }}
        NODE_AUTH_TOKEN: ${{ inputs.NPM_TOKEN }}

    - name: ci-setup | release-check
      id: release-check
      uses: vezham/v0xFE-deployer/.github/actions/common/changesets-release-check@timeline

    - name: Get Changed Packages
      if: steps.changesets.outputs.hasChangesets == 'false'
      # if: steps.changesets.outputs.published == 'true'
      id: changed
      shell: bash
      run: |
        PACKAGES=$(npx changeset status --output=json | jq -r '.releases[] | "\(.name)@\(.newVersion)"')
        echo "packages<<EOF" >> $GITHUB_OUTPUT
        echo "$PACKAGES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      
