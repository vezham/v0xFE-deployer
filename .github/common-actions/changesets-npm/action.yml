name: changesets for release 
description: Sets up Changesets for NPM release

inputs:
  GITHUB_TOKEN:
    required: true
    type: string
  NPM_TOKEN:
    required: true
    type: string

runs:
  using: composite
  steps:
    - name: npm | whoami
      shell: bash
      run: |
        npm login
        npm whoami
    
    - name: changesets/NPM | release - create release PR & Publish
      id: changesets
      uses: changesets/action@v1
      with:
        publish: pnpm run v:changeset:release
        # version: pnpm run version
        title: "ci(changesets): :package: version packages"
        commit: "ci(changesets): version packages"
        # setupGitUser: false
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        NPM_TOKEN: ${{ inputs.NPM_TOKEN }}
        # NODE_AUTH_TOKEN: ${{ inputs.NPM_TOKEN }}
